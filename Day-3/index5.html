<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3 - Event Handling</title>
</head>
<body>

    <h1>Event Handling Practice</h1>

    <!-- Part 1: addEventListener -->
    <button id="myButton">Click Me</button>

    <!-- Part 2: Named callback -->
    <button id="messageButton">Show Message</button>

    <!-- Part 3: removeEventListener -->
    <button id="removeButton">Say Hello</button>
    <button id="stopButton">Remove Hello Listener</button>

    <!-- Part 4: target and currentTarget -->
    <div id="parent" style="padding: 30px; background: lightblue;">
        Parent
        <button id="child">Child Button</button>
    </div>

    <!-- Part 5: Input event -->
    <input
        id="nameInput"
        type="text"
        placeholder="Enter your name"
    >

    <!-- Connect File 5 -->
    <script src="5-event-handling.js"></script>

</body>
</html>
